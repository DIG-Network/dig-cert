name: Publish to crates.io

# Tag-driven publish: pushing a version tag `vX.Y.Z` builds, packages and publishes to crates.io.
# A push to `main` runs the gates only (ci.yml) and does NOT publish. `release.yml` is what cuts the
# tag from the PR-bumped version, so the ordering is: merge -> release.yml tags -> this workflow runs.
#
# dig-cert has NO DIG dependencies and NO `[patch.crates-io]` section: every dependency (rcgen,
# rustls, rustls-pki-types, rustls-pemfile, x509-parser, tempfile, arc-swap, thiserror, time,
# tracing) is a plain crates.io version. So the published artifact is behaviourally identical to the
# git-sourced one, and there is no release-first ordering constraint on any other DIG crate.
#
# Added for dig_ecosystem#901: dig-node pinned this crate by git tag purely because it was
# unpublished, which is an NC-7 violation with no safety rationale behind it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v0.1.2)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify the package builds
        run: cargo build --release

      # `cargo package` is the real gate here, not a formality: it is what would reject a bare
      # `path = "../x"` dependency, and it re-verifies the packaged tree compiles from the manifest
      # alone rather than from the working checkout.
      - name: Verify the package can be packaged
        run: cargo package --locked

      - name: Check CARGO_REGISTRY_TOKEN is set
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set in repository settings"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "dig-cert v${{ steps.extract_version.outputs.VERSION }}"
          body: |
            ## dig-cert v${{ steps.extract_version.outputs.VERSION }}

            Per-machine name-constrained local TLS CA + leaf issuance + automatic renewal for
            `dig.local` and the `.dig` TLD.

            ### Installation
            ```toml
            [dependencies]
            dig-cert = "${{ steps.extract_version.outputs.VERSION }}"
            ```
          draft: false
          prerelease: false
